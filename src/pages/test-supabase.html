<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Supabase – Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <h1 class="text-2xl font-serif mb-4">🧪 Test Koneksi Supabase (tabel “guru”)</h1>
  <div id="result" class="mt-4"></div>

  <script type="module">
    import { supabase } from '../supabaseClient.js';

    async function loadGuru() {
      const { data, error } = await supabase.from('guru').select('*');
      const container = document.getElementById('result');

      if (error) {
        container.innerHTML = `<p class="text-red-600">❌ Gagal mengambil data: ${error.message}</p>`;
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-600">⚠️ Tabel “guru” kosong atau belum ada data.</p>';
        return;
      }

      const rows = data.map(row => `
        <tr class="border-b">
          <td class="px-4 py-2">${row.id ?? ''}</td>
          <td class="px-4 py-2">${row.nama ?? ''}</td>
          <td class="px-4 py-2">${row.mapel ?? ''}</td>
        </tr>`).join('');

      container.innerHTML = `
        <table class="min-w-full border">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-2">ID</th>
              <th class="px-4 py-2">Nama</th>
              <th class="px-4 py-2">Mata Pelajaran</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    window.addEventListener('DOMContentLoaded', loadGuru);
  </script>
</body>
</html>
